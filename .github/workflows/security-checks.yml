name: Security regression checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx python-dotenv fastapi uvicorn websockets twilio python-multipart aiosqlite
      - name: Test credential handling and installer
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend/tests -p test_password_hash.py -v
          python -m unittest discover -s backend/tests -p test_publication_security.py -v
          python -m unittest discover -s backend/tests -p test_gateway_security.py -v
          python -m unittest discover -s backend/tests -p test_groq_architecture.py -v
          python -m unittest discover -s backend/tests -p test_publication_privacy.py -v
